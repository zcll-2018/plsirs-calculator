<script>// Locked PL-SIRS numerical kernels. Inputs are encoded formula rows, not UI fields.
// The UI adapter must validate and encode clinical fields before calling these.
function sigmoid(value) {
  if (!Number.isFinite(value)) throw new Error('Non-finite model logit');
  return value >= 0
    ? 1 / (1 + Math.exp(-value))
    : Math.exp(value) / (1 + Math.exp(value));
}

function normalize(raw) {
  const sum = raw.reduce((total, value) => total + value, 0);
  if (!Number.isFinite(sum) || sum <= 0) throw new Error('Invalid model score sum');
  const normalized = raw.map(value => value / sum);
  if (normalized.some(value => !Number.isFinite(value))) throw new Error('Non-finite normalized score');
  return normalized;
}

function finiteValue(row, key) {
  const value = row[key];
  if (value === null || value === undefined || value === '') throw new Error(`Missing model input: ${key}`);
  const number = Number(value);
  if (!Number.isFinite(number)) throw new Error(`Invalid model input: ${key}`);
  return number;
}

function calculateSPL(encodedRow, lockedEquations) {
  if (!lockedEquations || lockedEquations.equations?.length !== 7 ||
      lockedEquations.classification_order?.length !== 7) {
    throw new Error('Invalid SPL-IRS locked equations');
  }
  const logits = lockedEquations.equations.map(equation => {
    let value = Number(equation.intercept);
    if (!Number.isFinite(value)) throw new Error('Invalid SPL-IRS intercept');
    for (const term of equation.terms) {
      const sd = Number(term.sd);
      if (!Number.isFinite(sd) || sd === 0) throw new Error(`Invalid SPL-IRS scale: ${term.variable_key}`);
      value += Number(term.coefficient) *
        (finiteValue(encodedRow, term.variable_key) - Number(term.mean)) / sd;
    }
    return value;
  });
  const raw = logits.map(sigmoid);
  const scores = normalize(raw);
  const winner = scores.indexOf(Math.max(...scores));
  return { classes: lockedEquations.classification_order, logits, raw, scores, winner };
}

function calculateIASLC(encodedRow, lockedModel) {
  if (!lockedModel || lockedModel.features?.length !== 23 ||
      lockedModel.mean?.length !== 23 || lockedModel.scale?.length !== 23 ||
      lockedModel.coefficients?.length !== 3 || lockedModel.intercepts?.length !== 3) {
    throw new Error('Invalid IASLC-IRS locked model');
  }
  const standardized = lockedModel.features.map((feature, index) => {
    const sd = Number(lockedModel.scale[index]);
    if (!Number.isFinite(sd) || sd === 0) throw new Error(`Invalid IASLC-IRS scale: ${feature}`);
    return (finiteValue(encodedRow, feature) - Number(lockedModel.mean[index])) / sd;
  });
  const logits = lockedModel.coefficients.map((coefficients, gradeIndex) => {
    if (coefficients.length !== 23) throw new Error('Invalid IASLC-IRS coefficient count');
    let value = Number(lockedModel.intercepts[gradeIndex]);
    for (let index = 0; index < 23; index++) value += Number(coefficients[index]) * standardized[index];
    return value;
  });
  const raw = logits.map(sigmoid);
  const scores = normalize(raw);
  const winner = scores.indexOf(Math.max(...scores));
  return { logits, raw, scores, grade: winner + 1 };
}

// Supplementary Figure 1 and Method 2 (2026-10-12). The score is the count
// of the three binary semantic findings, not the original 0–6 SSN score.
function calculateSSN(density, pleuralIndentation, vacuole, vascularInvasion, solidDiameterMm) {
  if (![pleuralIndentation, vacuole, vascularInvasion].every(value => value === 0 || value === 1)) {
    throw new Error('Missing or invalid SSN semantic feature');
  }
  const score = pleuralIndentation + vacuole + vascularInvasion;
  let category;
  if (density === 'noncore') category = score === 0 ? 1 : score === 1 ? 2 : 3;
  else if (density === 'core') category = score === 0 ? 2 : 3;
  else if (density === 'partsolid') {
    if (!Number.isFinite(solidDiameterMm) || solidDiameterMm < 0) {
      throw new Error('Missing or invalid solid-component diameter');
    }
    category = solidDiameterMm <= 6 ? 4 : 5;
  } else throw new Error('Invalid subsolid density');
  return { category, semanticScore: score, routeToIASLC: category === 5 };
}

// Minimal OOXML package writer using ZIP stored entries. No runtime library or network.
const WORD_ENCODER=new TextEncoder();
const xmlEscape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[char]));
const crcTable=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?0xedb88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(bytes){let c=0xffffffff;for(const byte of bytes)c=crcTable[(c^byte)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function zipStore(files){const local=[],central=[];let offset=0;for(const [name,body] of files){const nameBytes=WORD_ENCODER.encode(name),data=WORD_ENCODER.encode(body),crc=crc32(data);const header=new Uint8Array(30+nameBytes.length);const view=new DataView(header.buffer);view.setUint32(0,0x04034b50,true);view.setUint16(4,20,true);view.setUint16(6,0x0800,true);view.setUint16(8,0,true);view.setUint32(14,crc,true);view.setUint32(18,data.length,true);view.setUint32(22,data.length,true);view.setUint16(26,nameBytes.length,true);header.set(nameBytes,30);local.push(header,data);
  const cent=new Uint8Array(46+nameBytes.length),cv=new DataView(cent.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,nameBytes.length,true);cv.setUint32(42,offset,true);cent.set(nameBytes,46);central.push(cent);offset+=header.length+data.length}

function encodeSPL(){const row={},set=(key,value)=>{row[key]=value};
  set('Age (years)',finite('age'));set('Sex: male (1/0)',state.sex==='male'?1:0);
  set('Vascular invasion (1/0)',bit('vascular'));set('Pleural indentation (1/0)',bit('pleural'));
  set('Lung-window long-axis diameter (mm; SPL-IRS formula input)',finite('lungLong'));
  set('Location: central (1/0)',state.location==='central'?1:0);
  set('Lung side: right (1/0)',state.lobe?.startsWith('R')?1:0);
  for(const [key,value] of [['Lobe: upper (1/0)',['RUL','LUL'].includes(state.lobe)],['Lobe: middle (1/0)',state.lobe==='RML'],['Lobe: lower (1/0)',['RLL','LLL'].includes(state.lobe)],['Shape: irregular (1/0)',state.shape==='irregular'],['Margin: smooth (1/0)',state.margin==='smooth'],['Margin: lobulated (1/0)',state.margin==='lobulated'],['Margin: spiculated (1/0)',state.margin==='spiculated'],['Heterogeneous enhancement (1/0)',state.pattern==='heterogeneous'],['Uniform enhancement (1/0)',state.pattern==='uniform'],['No enhancement (1/0)',state.pattern==='none']])set(key,value?1:0);
  for(const [key,source] of [['Air bronchograms (1/0)','air'],['Cavitation (1/0)','cavitation'],['Postobstructive pneumonia (1/0)','postobs'],['Calcification (1/0)','calcification'],['Fat (1/0)','fat'],['Necrosis (1/0)','necrosis'],['Pleural effusion (1/0)','effusion'],['Satellite nodules (1/0)','satellite'],['Lymph node abnormality (1/0)','lymph']])set(key,bit(source));
  set('Unenhanced CT attenuation (HU)',finite('plainHU'));set('Enhanced CT attenuation (HU)',finite('enhancedHU'));
  set('Enhancement difference (HU)',finite('enhancedHU')-finite('plainHU'));
  return row;
}
function encodeIASLC(){const map={density_noncore:state.density==='noncore'?1:0,density_core:state.density==='core'?1:0,density_partsolid:state.density==='partsolid'?1:0,lung_long_cm:finite('lungLong')/10,mediastinal_long_cm:finite('mediaLong')/10,solid_gt_half:solidGtHalf(),plain_CT:finite('plainHU'),lung_short_cm:finite('lungShort')/10,postobstructive:bit('postobs'),vacuole:bit('vacuole'),margin_spiculated:state.margin==='spiculated'?1:0,gender:state.sex==='male'?1:0,cavitation:bit('cavitation'),margin_lobulated:state.margin==='lobulated'?1:0,shape:state.shape==='irregular'?1:0,age:finite('age'),vascular_invasion:bit('vascular'),lobe_RML:state.lobe==='RML'?1:0,lobe_LUL:state.lobe==='LUL'?1:0,lobe_RLL:state.lobe==='RLL'?1:0,lobe_LLL:state.lobe==='LLL'?1:0,air_bronchograms:bit('air'),pleural_indentation:bit('pleural')};return map}
function calculate(){errors=validate();if(errors.length){if(mode==='guided'){const key=errors[0].key;step=BY_KEY[key].group==='clinical'?0:BY_KEY[key].group==='lesion'?1:2}render();document.getElementById(`field-${errors[0].key}`)?.focus();return}
  try{let upstream,grade=null;if(isSolid()){upstream={type:'spl',...calculateSPL(encodeSPL(),MODEL_SPL)};if(upstream.winner===0)grade=calculateIASLC(encodeIASLC(),MODEL_IASLC)}else if(isSubsolid()){upstream={type:'ssn',...calculateSSN(state.density,bit('pleural'),bit('vacuole'),bit('vascular'),finite('mediaLong'))};if(upstream.routeToIASLC)grade=calculateIASLC(encodeIASLC(),MODEL_IASLC)}else throw new Error('Unknown density');result={upstream,grade};errors=[];render();setTimeout(()=>$('#result-anchor')?.scrollIntoView({behavior:'smooth'}),20)}catch(error){result=null;errors=[{key:'density',message:error.message}];render()}}
function renderHeader(){return `<header class="topbar screen-only"><div class="topinner"><button class="brand" data-action="home">PL-SIRS<small>${c('heroSubtitle')}</small></button><nav class="nav" aria-label="${c('mainNavigation')}">${[['overview','overview'],['assessment','assessment']].map(([id,label])=>`<button data-page="${id}" class="${page===id?'active':''}">${c(label)}</button>`).join('')}</nav><div class="lang" aria-label="${c('languageSelector')}"><button data-lang="en" class="${language==='en'?'active':''}">English</button><button data-lang="zh" class="${language==='zh'?'active':''}">中文</button></div></div></header>`}
function renderOverview(){return `<main class="shell"><section class="hero"><div><h1>${c('heroTitle')}</h1><div class="eyebrow scientific-name">${c('heroKicker')}</div><div class="hero-subtitle">${c('heroSubtitle')}</div><p>${c('heroLead')}</p><h2 class="start-title">${c('startAssessment')}</h2><div class="mode-options"><div class="mode-option"><button class="button primary" data-mode="guided">${c('guided')} →</button><p>${c('guidedDesc')}</p></div><div class="mode-option"><button class="button secondary" data-mode="expert">${c('expert')} →</button><p>${c('expertDesc')}</p></div></div></div><div class="hero-art" aria-hidden="true"><div class="artlabel">PL-SIRS</div><div class="art-flow"><div class="art-step"><span>${c('stepA')}</span></div><div class="art-step"><span>${c('stepB')}</span></div><div class="art-step"><span>${c('stepC')}</span></div></div></div></section><section class="section"><h2 class="section-title">${c('flow')}</h2><div class="cards">${[['stepA','stepAT'],['stepB','stepBT'],['stepC','stepCT']].map(([title,body])=>`<article class="card"><h3>${c(title)}</h3><p>${c(body)}</p></article>`).join('')}</div><div class="notice">${c('research')}</div></section></main>`}
function fieldHTML(field){const value=valueOf(field.key),isReq=required(field)&&field.type!=='derived'&&field.type!=='derivedBinary',err=errors.some(issue=>issue.key===field.key),reference=FIELD_REF[field.key];let control='';if(field.type==='select'||field.type==='binary'){
  const opts=field.type==='binary'?[['1',c('yes')],['0',c('no')]]:OPTIONS[field.options].map(row=>[row[0],row[language==='en'?1:2]]);
  control=`<select id="field-${field.key}" data-key="${field.key}" ${isReq?'required':''}><option value="">${field.type==='binary'?c('notAssessed'):c('choose')}</option>${opts.map(([id,label])=>`<option value="${esc(id)}" ${value===id?'selected':''}>${esc(label)}</option>`).join('')}</select>`;
}else if(field.type==='textarea'){control=`<textarea id="field-${field.key}" data-key="${field.key}">${esc(value)}</textarea>`}else if(field.type==='derived'||field.type==='derivedBinary'){let derived='';if(field.key==='delta'&&valueOf('plainHU')!==''&&valueOf('enhancedHU')!==''&&Number.isFinite(Number(state.plainHU))&&Number.isFinite(Number(state.enhancedHU)))derived=String(Number(state.enhancedHU)-Number(state.plainHU));if(field.key==='solidGtHalf'&&Number(state.lungLong)>0&&valueOf('mediaLong')!==''&&Number.isFinite(Number(state.mediaLong)))derived=solidGtHalf()?c('yes'):c('no');control=`<input id="field-${field.key}" value="${esc(derived)}" readonly aria-readonly="true">`;}else{control=`<input id="field-${field.key}" data-key="${field.key}" type="number" step="any" inputmode="decimal" value="${esc(value)}" ${isReq?'required':''}>`}
  const hint=field.key==='freeText'?c('supplementHint'):field.key==='delta'?c('deltaHint'):field.key==='solidGtHalf'?c('derivedRatio'):'';
  return `<div class="field ${field.type==='textarea'||OPTION_REF[field.key]?'wide':''} ${err?'error':''}"><label for="field-${field.key}">${esc(tr(field.label))}${field.unit?` <span>(${field.unit==='years'?c('ageUnit'):field.unit})</span>`:''}${isReq?'<span class="required">*</span>':''}${reference?`<button type="button" class="help" data-ref="${field.key}" aria-label="${c('helpTitle')}: ${esc(tr(field.label))}">i</button>`:''}</label>${control}${mode==='guided'&&reference?`<div class="field-brief">${esc(tr(reference.brief))}</div>`:''}${hint?`<div class="hint">${esc(hint)}</div>`:''}${optionGalleryHTML(field)}</div>`}
function groupHTML(group,title){const fields=activeFields().filter(field=>field.group===group);if(!fields.length)return '';return `<section class="group"><h3>${title}</h3><div class="fieldgrid">${fields.map(fieldHTML).join('')}</div></section>`}
function errorHTML(){return errors.length?`<div class="errorbox" role="alert"><strong>${c('errorTitle')}</strong><ul>${errors.map(issue=>`<li>${esc(issue.message)}</li>`).join('')}</ul></div>`:''}
function reviewHTML(){return `<p class="intro">${c('reviewLead')}</p><div class="fieldgrid">${activeFields().filter(field=>field.type!=='textarea').map(field=>`<div><strong>${esc(tr(field.label))}</strong><br>${esc(displayValue(field))}</div>`).join('')}<div><strong>${c('freeText')}</strong><br>${esc(state.freeText||c('none'))}</div></div>`}
function displayValue(field){if(field.key==='solidGtHalf')return Number(state.lungLong)>0&&valueOf('mediaLong')!==''?(solidGtHalf()?c('yes'):c('no')):c('notRecorded');if(field.key==='delta')return isSolid()?`${Number(state.enhancedHU)-Number(state.plainHU)} HU`:c('notApplicable');const raw=valueOf(field.key);if(raw==='')return c('notRecorded');if(field.type==='binary')return raw==='1'?c('yes'):c('no');if(field.options)return optionLabel(field.options,raw);return raw+(field.unit?` ${field.unit==='years'?c('ageUnit'):field.unit}`:'')}
function renderForm(){const titles=['clinical','lesion','features','supplement','review'];const panel=mode==='guided'?(step===4?reviewHTML():step===2?groupHTML('features',c('features'))+groupHTML('enhancement',c('enhancementFeatures')):groupHTML(titles[step],c(titles[step]))):groupHTML('clinical',c('clinical'))+groupHTML('lesion',c('lesion'))+groupHTML('features',c('features'))+groupHTML('enhancement',c('enhancementFeatures'))+groupHTML('supplement',c('supplement'));
  return `<div class="workspace"><aside class="side panel screen-only"><div class="side-title">${c('assessment')}</div><div class="modebar"><button data-switch="guided" class="${mode==='guided'?'active':''}">${c('guidedShort')}</button><button data-switch="expert" class="${mode==='expert'?'active':''}">${c('expertShort')}</button></div><p class="hint">${c('modeNote')}</p>${mode==='guided'?`<div class="steps">${titles.map((title,index)=>`<button data-step="${index}" class="${step===index?'active':''}">${index+1}. ${c(title)}</button>`).join('')}</div>`:''}</aside><div><section class="formpanel panel screen-only"><h2>${mode==='guided'?c(titles[step]):c('assessment')}</h2>${state.density?'':`<p class="intro">${c('densityGuide')}</p>`}${errorHTML()}${panel}<div class="form-actions">${mode==='guided'?`<button class="button secondary" data-action="back" ${step===0?'disabled':''}>← ${c('back')}</button>`:'<span></span>'}<div>${mode==='guided'&&step<4?`<button class="button primary" data-action="next">${c('next')} →</button>`:`<button class="button primary" data-action="calculate">${c('calculate')} →</button>`}</div></div></section>${result?renderResults():''}</div></div>`}
function scoreRows(names,scores,winner){return names.map((name,index)=>`<div class="score ${winner===index?'winner':''}"><span>${esc(name)}</span><div class="track"><div class="fill" style="width:${Math.max(0,Math.min(100,scores[index]*100))}%"></div></div><span>${formatScore(scores[index])}</span></div>`).join('')}
function renderResults(){const up=result.upstream,grade=result.grade;const upstream=up.type==='spl'?`<div class="result-tag">${c('predicted')}: ${tr(SPL_NAMES[up.winner])}</div><p>${c('normalized')}</p>${scoreRows(SPL_NAMES.map(tr),up.scores,up.winner)}<div class="aggregates"><span>${c('malignant')}: <strong>${formatScore(up.scores[0]+up.scores[1]+up.scores[2])}</strong></span><span>${c('benign')}: <strong>${formatScore(up.scores.slice(3).reduce((a,b)=>a+b,0))}</strong></span></div>`:`<div class="result-tag">SSN ${up.category}</div><p>${c('ssnResult')} · ${c(`scoreMeaning${up.category}`)}. ${c('semanticScore')}: ${up.semanticScore}.</p>`;
  return `<div id="result-anchor" class="result-wrap"><div class="result-header screen-only"><h2 class="section-title">${c('results')}</h2><div class="toolbar"><button class="button secondary" data-action="print">${c('print')}</button><button class="button secondary" data-action="docx">${c('docx')}</button><button class="button quiet" data-action="copy">${c('copy')}</button></div></div><div class="result-card panel screen-only"><h3>${c('resultOne')}</h3>${upstream}</div><div class="result-card panel screen-only"><h3>${c('resultTwo')}</h3>${grade?`<div class="result-tag">Grade ${grade.grade}</div><p>${c('normalized')}</p>${scoreRows(['Grade 1','Grade 2','Grade 3'],grade.scores,grade.grade-1)}`:`<p>${c('gradeNotPerformed')}</p>`}</div>${renderReport()}</div>`}
function reportSections(){const row=(label,value)=>[label,value],v=key=>{const f=BY_KEY[key];return !visible(f)?c('notApplicable'):displayValue(f)};const binary=key=>!visible(BY_KEY[key])?c('notApplicable'):valueOf(key)===''?c('notRecorded'):state[key]==='1'?c('yes'):c('no');
  const delta=isSolid()?`${Number(state.enhancedHU)-Number(state.plainHU)} HU`:c('notApplicable');
  const up=result.upstream,grade=result.grade;let assessment=[];
  if(up.type==='ssn'){assessment.push(row('SSN-IRS',`SSN ${up.category}`),row(c('semanticScore'),String(up.semanticScore)),row('SPL-IRS',c('notApplicable')))}
  else{assessment.push(row('SSN-IRS',c('notApplicable')));up.scores.forEach((score,index)=>assessment.push(row(`SPL-IRS · ${tr(SPL_NAMES[index])}`,formatScore(score))));assessment.push(row(`${c('aggregate')} · ${c('malignant')}`,formatScore(up.scores[0]+up.scores[1]+up.scores[2])),row(`${c('aggregate')} · ${c('benign')}`,formatScore(up.scores.slice(3).reduce((a,b)=>a+b,0))))}
  [1,2,3].forEach(index=>assessment.push(row(`IASLC-IRS · Grade ${index}`,grade?formatScore(grade.scores[index-1]):c('notApplicable'))));
  let impression;if(up.type==='spl'){const type=tr(SPL_NAMES[up.winner]);impression=formatTemplate(c(up.winner<3?'solidOutcome':'solidOutcomeBenign'),{type:language==='en'?type[0].toLowerCase()+type.slice(1):type,score:formatScore(up.scores[up.winner]),aggregate:formatScore(up.winner<3?up.scores[0]+up.scores[1]+up.scores[2]:up.scores.slice(3).reduce((a,b)=>a+b,0))});if(grade)impression+=formatTemplate(c('solidGrade'),{grade:grade.grade,score:formatScore(grade.scores[grade.grade-1])})}else{impression=formatTemplate(c('ssnOutcome'),{category:up.category,meaning:c(`scoreMeaning${up.category}`)});if(grade)impression+=formatTemplate(c('ssnGrade'),{grade:grade.grade,score:formatScore(grade.scores[grade.grade-1])})}
  return [
    {title:c('patient'),rows:[row(tr(BY_KEY.age.label),v('age')),row(tr(BY_KEY.sex.label),v('sex'))]},
    {title:c('lesionReport'),rows:['lobe','location','density','lungLong','lungShort','mediaLong','mediaShort','shape','margin','plainHU','enhancedHU'].map(key=>row(tr(BY_KEY[key].label),v(key))).concat([row(tr(BY_KEY.delta.label),delta),row(tr(BY_KEY.pattern.label),v('pattern'))])},
    {title:c('featuresReport'),rows:['pleural','vascular','vacuole','air','cavitation','postobs','necrosis','lymph','calcification','fat','satellite','effusion'].map(key=>row(tr(BY_KEY[key].label),binary(key))).concat([row(tr(BY_KEY.solidGtHalf.label),v('solidGtHalf')),row(language==='en'?'Solid-component diameter >6 mm':'实性成分直径 >6 mm',state.density==='partsolid'?(Number(state.mediaLong)>6?c('yes'):c('no')):c('notApplicable'))])},
    {title:c('assessmentReport'),rows:assessment},
    {title:c('impression'),text:impression},
    {title:c('freeText'),text:state.freeText||c('none')}
  ];
}
function renderReport(){return `<article class="report" id="structured-report"><h2>${c('reportTitle')}</h2>${reportSections().map(section=>`<section class="report-section"><h3>${esc(section.title)}</h3>${section.rows?`<table><tbody>${section.rows.map(([label,value])=>`<tr><td>${esc(label)}</td><td>${esc(value)}</td></tr>`).join('')}</tbody></table>`:`<div class="freetext">${esc(section.text)}</div>`}</section>`).join('')}<div class="report-note">${c('reportNote')}</div></article>`}
function renderAssessment(){return `<main class="shell"><div class="pagehead screen-only"><div><div class="eyebrow">PL-SIRS / ${c('assessment')}</div><h1>${c('assessmentTitle')}</h1><p>${c('assessmentLead')}</p></div><div class="toolbar"><button class="button secondary" data-action="example">${c('example')}</button><button class="button quiet" data-action="clear">${c('clear')}</button></div></div>${renderForm()}</main>`}
function renderHelp(){if(!referenceOpen)return '';const [fieldKey]=referenceOpen.split(':'),heading=tr(BY_KEY[fieldKey].label);return `<div class="modal-backdrop" data-action="closehelp"><div class="modal reference-modal ${zoomOpen?'zoomed':''}" role="dialog" aria-modal="true" aria-labelledby="help-heading"><div class="modal-head"><h2 id="help-heading">${c('helpTitle')} · ${esc(heading)}</h2><button class="close" data-action="closehelp" aria-label="${language==='en'?'Close':'关闭'}">×</button></div>${fullFigureOpen?`<button type="button" class="button secondary" data-action="backref">← ${c('back')}</button><h3>${figureLabel(fullFigureOpen)}</h3><button type="button" class="full-figure-image" data-action="zoom" aria-label="${c(zoomOpen?'restoreImage':'enlargeImage')}"><img src="${figureURL(fullFigureOpen)}" alt="${figureLabel(fullFigureOpen)}"></button>`:referenceBodyHTML()}</div></div>`}
function render(){document.documentElement.lang=language;document.title=`PL-SIRS | ${c(page)}`;$('#app').innerHTML=renderHeader()+(page==='overview'?renderOverview():renderAssessment())+`<footer class="footer screen-only"><div class="shell"><span>${c('version')}: ${c('versionText')}</span></div></footer>`+renderHelp();if(referenceOpen)$('.modal .close')?.focus()}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action],[data-page],[data-lang],[data-mode],[data-switch],[data-step],[data-ref]');if(!target)return;
  if(target.dataset.page)setPage(target.dataset.page);
  else if(target.dataset.lang){language=target.dataset.lang;render()}
  else if(target.dataset.mode)selectMode(target.dataset.mode);
  else if(target.dataset.switch){mode=target.dataset.switch;step=0;render()}
  else if(target.dataset.step)goStep(Number(target.dataset.step))
  else if(target.dataset.ref){referenceOpen=target.dataset.ref;fullFigureOpen=null;zoomOpen=false;render()}
  else if(target.dataset.action==='home')setPage('overview');
  else if(target.dataset.action==='example')loadExample();
  else if(target.dataset.action==='clear')clearForm();
  else if(target.dataset.action==='next')nextStep()
  else if(target.dataset.action==='back'){step=Math.max(0,step-1);render()}
  else if(target.dataset.action==='calculate')calculate();
  else if(target.dataset.action==='print'){if(result)window.print()}
  else if(target.dataset.action==='docx'){if(result)downloadDOCX()}
  else if(target.dataset.action==='copy'){if(result){const text=[c('reportTitle'),...reportSections().map(section=>`${section.title}\n${section.rows?section.rows.map(row=>row.join(': ')).join('\n'):section.text}`),c('reportNote')].join('\n\n');(()=>{const fallback=()=>{const area=document.createElement('textarea');area.value=text;document.body.append(area);area.select();document.execCommand('copy');area.remove();alert(c('copied'))};const promise=navigator.clipboard?.writeText(text);if(promise)promise.then(()=>alert(c('copied'))).catch(fallback);else fallback()})()}}
  else if(target.dataset.action==='fullfigure'){fullFigureOpen=Number(target.dataset.figure);zoomOpen=false;render()}
  else if(target.dataset.action==='backref'){fullFigureOpen=null;zoomOpen=false;render()}
  else if(target.dataset.action==='zoom'){zoomOpen=!zoomOpen;render()}
  else if(target.dataset.action==='closehelp'){if(event.target===target||target.classList.contains('close')){referenceOpen=null;fullFigureOpen=null;zoomOpen=false;render()}}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&referenceOpen){referenceOpen=null;fullFigureOpen=null;zoomOpen=false;render()}});
document.addEventListener('input',event=>{const key=event.target.dataset.key;if(!key)return;state[key]=event.target.value;if(result){result=null;$('#result-anchor')?.remove()}if(key==='plainHU'||key==='enhancedHU'){const delta=$('#field-delta');if(delta)delta.value=valueOf('plainHU')!==''&&valueOf('enhancedHU')!==''?String(Number(state.enhancedHU)-Number(state.plainHU)):''}});
document.addEventListener('change',event=>{const key=event.target.dataset.key;if(key==='density'||key==='mediaLong'||key==='lungLong'||key==='shape'||key==='margin'||key==='pattern'){state[key]=event.target.value;result=null;errors=[];render()}});
render();

</script>
</body>
